<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Synox AI</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf3f2;
    --panel:#fffafa;
    --ink:#3a2d2d;
    --muted:#a98c8c;
    --line:#f4dcdb;
    --accent:#c98a8f;
    --accent-soft:#fbe6e6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:10px;
    background:var(--panel);
  }
  header h1{
    font-family:'Newsreader',serif;
    font-weight:600;
    font-size:22px;
    margin:0;
    letter-spacing:0.2px;
    color:#8a4a52;
  }
  header span{
    font-size:12px;
    color:var(--muted);
  }
  #chat{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 100px;
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:640px;
    width:100%;
    margin:0 auto;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius:16px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--accent);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--panel);
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .msg.bot.typing{color:var(--muted);font-style:italic;}
  #composer{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  #composer-inner{
    max-width:640px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:8px;
  }
  #input{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px;
    font-family:inherit;
    font-size:15px;
    max-height:120px;
    background:var(--bg);
    color:var(--ink);
  }
  #input:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  button.icon{
    border:none;
    background:var(--accent-soft);
    color:#8a4a52;
    width:42px; height:42px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  button.icon.active{background:var(--accent); color:#fff;}
  button.send{
    border:none;
    background:var(--accent);
    color:#fff;
    width:42px; height:42px;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  button:disabled{opacity:0.45; cursor:default;}
  #status{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    padding-top:4px;
  }
</style>
</head>
<body>

<header>
  <h1>Synox AI</h1>
  <span>küçük kapsamlı yapay zeka</span>
</header>

<div id="chat"></div>

<div id="composer">
  <div id="composer-inner">
    <button class="icon" id="micBtn" title="Sesli konuş">🎤</button>
    <textarea id="input" rows="1" placeholder="Bir şey yaz..."></textarea>
    <button class="icon" id="speakToggle" title="Sesli cevap aç/kapat">🔊</button>
    <button class="send" id="sendBtn" title="Gönder">➤</button>
  </div>
  <div id="status"></div>
</div>

<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const speakToggle = document.getElementById('speakToggle');
const statusEl = document.getElementById('status');

let history = [];
let speakEnabled = true;

function addMessage(role, text){
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

// Sesli okurken emojileri (ve diğer semboller/varyasyon seçicilerini) atla,
// böylece TTS "gülen yüz" gibi şeyler söylemeye çalışmaz.
function stripEmojis(text){
  return text
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F1E6}-\u{1F1FF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\uFE0F]/gu, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function speak(text){
  if(!speakEnabled || !('speechSynthesis' in window)) return;
  const clean = stripEmojis(text);
  if(!clean) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'tr-TR';
  window.speechSynthesis.speak(u);
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  sendBtn.disabled = true;

  const typingEl = addMessage('bot', 'yazıyor...');
  typingEl.classList.add('typing');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history })
    });
    const data = await res.json();
    typingEl.remove();

    if(!res.ok){
      addMessage('bot', 'Bir hata oluştu: ' + (data.error || 'bilinmeyen hata'));
      statusEl.textContent = '';
      return;
    }

    addMessage('bot', data.reply);
    history.push({ role: 'assistant', content: data.reply });
    speak(data.reply);
    statusEl.textContent = data.provider ? ('kaynak: ' + data.provider + (data.usedWeb ? ' · internet' : '')) : '';
  } catch (err){
    typingEl.remove();
    addMessage('bot', 'Sunucuya ulaşılamadı. Lütfen tekrar deneyin.');
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = inputEl.scrollHeight + 'px';
});

speakToggle.addEventListener('click', () => {
  speakEnabled = !speakEnabled;
  speakToggle.classList.toggle('active', speakEnabled);
  if(!speakEnabled) window.speechSynthesis.cancel();
});
speakToggle.classList.add('active');

// ---- Sesli giriş (mikrofon) ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  const recognition = new SpeechRecognition();
  recognition.lang = 'tr-TR';
  recognition.interimResults = false;

  let listening = false;
  micBtn.addEventListener('click', () => {
    if(listening){ recognition.stop(); return; }
    recognition.start();
  });
  recognition.onstart = () => { listening = true; micBtn.classList.add('active'); };
  recognition.onend = () => { listening = false; micBtn.classList.remove('active'); };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    inputEl.value = transcript;
    sendMessage();
  };
  recognition.onerror = () => { listening = false; micBtn.classList.remove('active'); };
} else {
  micBtn.disabled = true;
  micBtn.title = 'Bu tarayıcı sesli girişi desteklemiyor';
}

addMessage('bot', 'Merhaba, ben Synox AI. Sana nasıl yardımcı olabilirim?');
</script>

</body>
</html>
